name: macOS CI & Parallel App Package

on:
  push:
    branches:
      - main
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional existing CI run ID whose verified Suyoi-Next-macOS artifact should be attached to release_tag"
        required: false
        default: ""
      release_tag:
        description: "Optional release tag (e.g. v0.4.0-next.1) to upload verified Suyoi-Next.app.zip assets to"
        required: false
        default: ""
      export_screenshots:
        description: "Set to 'true' to render 2x Retina UI screenshots on macOS 15 and commit them to docs/screenshots/"
        required: false
        default: "false"

# Least privilege by default; only the release/screenshot jobs below request write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  macos-build-and-test:
    name: Build, Test & Package Suyoi Next (macOS 15)
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.run_id == '' && inputs.export_screenshots != 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Swift 6 Xcode toolchain
        run: |
          if ! swift --version | grep -q "Swift version 6\."; then
            XCODE_16="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$XCODE_16" ]; then
              sudo xcode-select -s "$XCODE_16/Contents/Developer"
            fi
          fi
          xcodebuild -version
          swift --version

      - name: Run Swift test suite
        run: swift test

      - name: Export 2x Retina UI screenshots
        run: |
          swift build --product Suyoi
          DEBUG_BIN_DIR="$(swift build --show-bin-path)"
          mkdir -p build/screenshots
          "$DEBUG_BIN_DIR/Suyoi" --export-screenshots build/screenshots
          ls -lh build/screenshots/*.png

      - name: Build parallel side-by-side Suyoi Next.app
        run: |
          # Tag builds embed the tag's version so the in-app updater compares correctly.
          case "${GITHUB_REF}" in
            refs/tags/v*)
              export SUYOI_VERSION="${GITHUB_REF_NAME#v}"
              export SUYOI_BUILD_VERSION="${SUYOI_VERSION%%-*}"
              ;;
          esac
          ./scripts/build-app.sh --parallel

      - name: Verify Suyoi Next bundle, signature, version, CLI & archive checksum
        run: |
          test -d "build/Suyoi Next.app"
          PLIST="build/Suyoi Next.app/Contents/Info.plist"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")"
          test "$BUNDLE_ID" = "local.suyoi.next"
          case "${GITHUB_REF}" in
            refs/tags/v*)
              SHORT="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")"
              test "$SHORT" = "${GITHUB_REF_NAME#v}"
              ;;
          esac
          /usr/bin/codesign --verify --deep --strict "build/Suyoi Next.app"
          "build/Suyoi Next.app/Contents/MacOS/Suyoi" --help
          (cd build && /usr/bin/shasum -a 256 -c Suyoi-Next.app.zip.sha256)

      - name: Upload Suyoi-Next.app.zip artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Suyoi-Next-macOS
          if-no-files-found: error
          path: |
            build/Suyoi-Next.app.zip
            build/Suyoi-Next.app.zip.sha256

      - name: Upload Suyoi-Next-Screenshots artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Suyoi-Next-Screenshots
          if-no-files-found: error
          path: build/screenshots/*.png

  publish-next-prerelease:
    name: Publish Suyoi Next Pre-release (tag)
    needs: macos-build-and-test
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Refuse non-Next tags
        run: |
          case "${GITHUB_REF_NAME}" in
            v*-next*) ;;
            *) echo "::error::Only vX.Y.Z-next.N tags may be published from this workflow"; exit 1 ;;
          esac

      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Suyoi-Next-macOS
          path: dist

      - name: Create or update pre-release (never marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c Suyoi-Next.app.zip.sha256)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            test "$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease --jq .isPrerelease)" = "true"
            gh release upload "${GITHUB_REF_NAME}" dist/Suyoi-Next.app.zip dist/Suyoi-Next.app.zip.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/Suyoi-Next.app.zip dist/Suyoi-Next.app.zip.sha256 \
              --verify-tag --prerelease --latest=false \
              --title "Suyoi Next ${GITHUB_REF_NAME}" --generate-notes
          fi

  attach-release-assets:
    name: Attach Verified Artifact to Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id != '' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate source run and target release, then attach
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::run_id must be numeric"; exit 1 ;; esac
          case "$RELEASE_TAG" in
            v*-next*) ;;
            *) echo "::error::Only -next pre-release tags may receive Suyoi Next assets"; exit 1 ;;
          esac
          RUN_JSON="$(gh run view "$RUN_ID" --json conclusion,event,headBranch,workflowName)"
          test "$(jq -r .conclusion <<<"$RUN_JSON")" = "success"
          test "$(jq -r .workflowName <<<"$RUN_JSON")" = "${GITHUB_WORKFLOW}"
          test "$(jq -r .event <<<"$RUN_JSON")" = "push"
          HEAD_BRANCH="$(jq -r .headBranch <<<"$RUN_JSON")"
          case "$HEAD_BRANCH" in
            next|v*-next*) ;;
            *) echo "::error::Source run must come from the next branch or a -next tag (got $HEAD_BRANCH)"; exit 1 ;;
          esac
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = "true"
          mkdir -p dist
          gh run download "$RUN_ID" -n Suyoi-Next-macOS --dir dist
          (cd dist && sha256sum -c Suyoi-Next.app.zip.sha256)
          gh release upload "$RELEASE_TAG" dist/Suyoi-Next.app.zip dist/Suyoi-Next.app.zip.sha256 --clobber

  render-screenshots:
    name: Render Retina UI Screenshots (macOS 15)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_screenshots == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select Swift 6 Xcode toolchain
        run: |
          if ! swift --version | grep -q "Swift version 6\."; then
            XCODE_16="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$XCODE_16" ]; then
              sudo xcode-select -s "$XCODE_16/Contents/Developer"
            fi
          fi
          xcodebuild -version
          swift --version

      - name: Build Debug Suyoi & export 2x Retina PNG screenshots
        run: |
          swift build --product Suyoi
          mkdir -p docs/screenshots
          .build/debug/Suyoi --export-screenshots docs/screenshots
          ls -lh docs/screenshots/*.png

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Suyoi-Next-Screenshots
          if-no-files-found: error
          path: docs/screenshots/*.png

      - name: Commit generated screenshots to docs/screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(screenshots): add 2x Retina macOS 15 screenshots for Suyoi Next [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
