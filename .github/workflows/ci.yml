name: macOS CI & Parallel App Package

on:
  push:
    branches:
      - main
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional existing CI run ID whose verified Suyoi-Next-macOS artifact should be attached to release_tag"
        required: false
        default: ""
      release_tag:
        description: "Optional release tag (e.g. v0.4.0-next.1) to upload verified Suyoi-Next.app.zip assets to"
        required: false
        default: ""
      export_screenshots:
        description: "Set to 'true' to render 2x Retina UI screenshots on macOS 15 and commit them to docs/screenshots/"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  macos-build-and-test:
    name: Build, Test & Package Suyoi Next (macOS 15)
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.run_id == '' && inputs.export_screenshots != 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Swift 6 Xcode toolchain
        run: |
          if ! swift --version | grep -q "Swift version 6\."; then
            XCODE_16="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$XCODE_16" ]; then
              sudo xcode-select -s "$XCODE_16/Contents/Developer"
            fi
          fi
          xcodebuild -version
          swift --version

      - name: Run Swift test suite
        run: swift test

      - name: Build parallel side-by-side Suyoi Next.app
        run: ./scripts/build-app.sh --parallel

      - name: Verify Suyoi Next bundle, signature, CLI & archive checksum
        run: |
          test -d "build/Suyoi Next.app"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "build/Suyoi Next.app/Contents/Info.plist")"
          test "$BUNDLE_ID" = "local.suyoi.next"
          /usr/bin/codesign --verify --deep --strict "build/Suyoi Next.app"
          "build/Suyoi Next.app/Contents/MacOS/Suyoi" --help
          (cd build && /usr/bin/shasum -a 256 -c Suyoi-Next.app.zip.sha256)

      - name: Upload Suyoi-Next.app.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suyoi-Next-macOS
          if-no-files-found: error
          path: |
            build/Suyoi-Next.app.zip
            build/Suyoi-Next.app.zip.sha256

      - name: Publish release assets on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" build/Suyoi-Next.app.zip build/Suyoi-Next.app.zip.sha256 --clobber
          else
            PRERELEASE_FLAG=""
            case "${GITHUB_REF_NAME}" in
              *-next*|*-beta*|*-rc*|*-alpha*) PRERELEASE_FLAG="--prerelease" ;;
            esac
            gh release create "${GITHUB_REF_NAME}" build/Suyoi-Next.app.zip build/Suyoi-Next.app.zip.sha256 ${PRERELEASE_FLAG} --title "Suyoi Next ${GITHUB_REF_NAME}" --generate-notes
          fi

  attach-release-assets:
    name: Attach Verified Artifact to Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id != '' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verified artifact and attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist
          gh run download "$RUN_ID" -n Suyoi-Next-macOS --dir dist
          (cd dist && sha256sum -c Suyoi-Next.app.zip.sha256)
          gh release upload "$RELEASE_TAG" dist/Suyoi-Next.app.zip dist/Suyoi-Next.app.zip.sha256 --clobber

  render-screenshots:
    name: Render Retina UI Screenshots (macOS 15)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_screenshots == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Swift 6 Xcode toolchain
        run: |
          if ! swift --version | grep -q "Swift version 6\."; then
            XCODE_16="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$XCODE_16" ]; then
              sudo xcode-select -s "$XCODE_16/Contents/Developer"
            fi
          fi
          xcodebuild -version
          swift --version

      - name: Build Debug Suyoi & export 2x Retina PNG screenshots
        run: |
          swift build --product Suyoi
          mkdir -p docs/screenshots
          .build/debug/Suyoi --export-screenshots docs/screenshots
          ls -lh docs/screenshots/*.png

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suyoi-Next-Screenshots
          if-no-files-found: error
          path: docs/screenshots/*.png

      - name: Commit generated screenshots to docs/screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(screenshots): add 2x Retina macOS 15 screenshots for Suyoi Next [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

